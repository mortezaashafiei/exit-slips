<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit Slip — Engineering Fundamentals</title>
<style>
  :root{
    --ink:#231F1E; --desk:#26201E; --maroon:#881C1C; --maroon-d:#5A1414;
    --gold:#FFB81C; --paper:#FFFDF8; --paper-edge:#E8E2D4; --grey:#6C6560;
    --line:#DDD6C8; --ok:#1F7A33; --cream:#FBF3DD;
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #3A2C28 0%, transparent 60%),
      var(--desk);
    color:var(--ink); padding:28px 14px 60px; display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:560px}
  .wide .wrap{max-width:980px}

  /* ---------- the slip ---------- */
  .slip{
    background:var(--paper); border-radius:0 0 14px 14px; position:relative;
    box-shadow:0 18px 40px rgba(0,0,0,.45), 0 2px 0 var(--paper-edge) inset;
    padding:26px 22px 24px;
  }
  .slip::before{ /* perforated tear line */
    content:""; position:absolute; left:0; right:0; top:0; height:0;
    border-top:2px dashed #C9C1AF;
  }
  .slip::after{ /* punched notches */
    content:""; position:absolute; top:-9px; left:24px; width:18px; height:18px;
    border-radius:50%; background:var(--desk); box-shadow:472px 0 0 var(--desk);
  }
  @media (max-width:560px){ .slip::after{ box-shadow:calc(100vw - 94px) 0 0 var(--desk); } }

  .kicker{color:var(--maroon); font-weight:700; letter-spacing:.02em; font-size:14px}
  h1{font-size:26px; line-height:1.15; margin:6px 0 2px; font-weight:800}
  .sub{color:var(--grey); font-size:14px; margin-bottom:18px}

  .prompt{font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:16px;
          color:var(--ink); margin:18px 0 6px}
  .prompt b{font-style:normal; font-family:inherit}
  input[type=text], textarea, select{
    width:100%; font:inherit; font-size:16px; color:var(--ink);
    background:transparent; border:0; border-bottom:2px solid var(--line);
    padding:8px 2px; border-radius:0; outline-offset:4px;
  }
  textarea{resize:vertical; min-height:52px; line-height:1.45}
  input:focus, textarea:focus, select:focus, button:focus-visible{
    outline:3px solid var(--gold); outline-offset:3px; border-radius:4px;
  }
  .row{display:flex; gap:14px}
  .row > *{flex:1}

  .choices{display:grid; gap:10px; margin-top:8px}
  .choice{border:2px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer;
          display:flex; gap:12px; align-items:baseline; background:#fff}
  .choice input{width:auto}
  .choice.sel{border-color:var(--maroon); background:var(--cream)}
  .choice .d{font-weight:700}
  .choice .m{color:var(--grey); font-size:13px}

  button{
    font:inherit; font-weight:700; border:0; border-radius:12px; cursor:pointer;
    padding:14px 18px; font-size:16px;
  }
  .primary{background:var(--maroon); color:#fff; width:100%; margin-top:22px}
  .primary:active{transform:translateY(1px)}
  .ghost{background:transparent; color:var(--maroon); border:2px solid var(--maroon)}
  .tiny{padding:7px 12px; font-size:13px; border-radius:9px}
  .goldbtn{background:var(--gold); color:var(--ink)}

  .modes{display:grid; gap:14px; margin-top:22px}
  .modes button{padding:20px; font-size:18px}

  /* stamp */
  .stampwrap{position:relative; min-height:120px; margin-top:8px}
  .stamp{
    position:absolute; right:8px; top:6px; transform:rotate(-8deg);
    border:3px solid var(--maroon); color:var(--maroon); border-radius:10px;
    padding:10px 16px; font-weight:800; font-size:20px; letter-spacing:.04em;
    opacity:.92; background:rgba(136,28,28,.04);
  }
  @media (prefers-reduced-motion:no-preference){
    .stamp{animation:thunk .38s cubic-bezier(.2,1.6,.4,1) both}
    @keyframes thunk{from{transform:rotate(-8deg) scale(2.4); opacity:0} to{transform:rotate(-8deg) scale(1); opacity:.92}}
  }
  .echo{border-left:4px solid var(--gold); background:var(--cream); padding:12px 14px; border-radius:0 10px 10px 0; margin-top:14px}
  .echo p{font-size:14px; margin:6px 0}
  .echo .q{color:var(--grey); font-size:12.5px}

  .note{font-size:13px; color:var(--grey); margin-top:14px; line-height:1.5}
  .err{color:#A31212; font-weight:700; font-size:14px; margin-top:10px}

  /* ---------- instructor ---------- */
  .bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0}
  .tab{border:2px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font-weight:700; cursor:pointer}
  .tab.sel{background:var(--maroon); color:#fff; border-color:var(--maroon)}
  table{border-collapse:collapse; width:100%; font-size:13.5px; background:#fff; border-radius:10px; overflow:hidden}
  th,td{border:1px solid #EEE7DA; padding:6px 8px; text-align:center}
  th{background:#F6F1E6; font-size:12px}
  td.name{text-align:left; font-weight:600; white-space:nowrap}
  td.on{background:var(--cream); color:var(--maroon); font-weight:800}
  td.pts{font-weight:800}
  .cards{display:grid; gap:12px; margin-top:12px}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px}
  .card h4{font-size:15px; margin-bottom:6px}
  .card .q{color:var(--grey); font-size:12px; margin-top:8px}
  .card .a{font-size:14.5px; white-space:pre-wrap}
  .card .a3{background:var(--cream); border-radius:8px; padding:8px 10px}
  .muted{color:#B9B2A4}
  .prog{font-size:13px; color:var(--gold); font-weight:700}
  .pill{background:var(--cream); border-radius:999px; padding:4px 10px; font-size:12.5px; font-weight:700; color:var(--maroon)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
/* ================= CONFIG ================= */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwnzMhXYqZVouiT9eHGd0oyjw9bzzKdXH5AwE8tzNyOtgNU5uehxoz-ox1jymCFpTql/exec";  // PASTE your Google Apps Script /exec URL here — or leave "" when running with server.py
const INSTRUCTOR_KEY = "1766921";           // used by the dashboard; the backend verifies it too
const BEST_OF = 10;                          // best 10 of 13 slips count

const SECTIONS = {
  "36-01": { label:"Monday 4:00 PM", room:"Dwight House 132", nbr:"19765",
    meetings:[["w01","Mon Sep 14"],["w02","Mon Sep 21"],["w03","Mon Sep 28"],["w04","Mon Oct 5"],
      ["w05","Mon Oct 19"],["w06","Mon Oct 26"],["lu1","Mon Nov 2"],["lu2","Mon Nov 9"],
      ["w07","Mon Nov 16"],["w08","Mon Nov 23"],["w09","Mon Nov 30"],["w10","Mon Dec 7"],["w11","Mon Dec 14"]],
    dates:{"w01":"2026-09-14","w02":"2026-09-21","w03":"2026-09-28","w04":"2026-10-05","w05":"2026-10-19","w06":"2026-10-26","lu1":"2026-11-02","lu2":"2026-11-09","w07":"2026-11-16","w08":"2026-11-23","w09":"2026-11-30","w10":"2026-12-07","w11":"2026-12-14"} },
  "37-24": { label:"Tuesday 4:00 PM", room:"Hasbrouck Lab Add 107", nbr:"21089",
    meetings:[["w01","Tue Sep 8"],["w02","Tue Sep 15"],["w03","Tue Sep 22"],["w04","Tue Sep 29"],
      ["w05","Tue Oct 6"],["lu1","Tue Oct 13"],["w06","Tue Oct 20"],["lu2","Tue Oct 27"],
      ["w07","Tue Nov 10"],["w08","Tue Nov 17"],["w09","Tue Dec 1"],["w10","Tue Dec 8"],["w11","Tue Dec 15"]],
    dates:{"w01":"2026-09-08","w02":"2026-09-15","w03":"2026-09-22","w04":"2026-09-29","w05":"2026-10-06","lu1":"2026-10-13","w06":"2026-10-20","lu2":"2026-10-27","w07":"2026-11-10","w08":"2026-11-17","w09":"2026-12-01","w10":"2026-12-08","w11":"2026-12-15"} },
  "37-25": { label:"Wednesday 11:15 AM", room:"Engineering Lab II 115", nbr:"21090",
    meetings:[["w01","Wed Sep 9"],["w02","Wed Sep 16"],["w03","Wed Sep 23"],["w04","Wed Sep 30"],
      ["w05","Wed Oct 7"],["lu1","Wed Oct 14"],["w06","Wed Oct 21"],["lu2","Wed Oct 28"],
      ["w07","Wed Nov 4"],["w08","Wed Nov 18"],["w09","TUE Nov 24"],["w10","Wed Dec 2"],["w11","Wed Dec 9"]],
    dates:{"w01":"2026-09-09","w02":"2026-09-16","w03":"2026-09-23","w04":"2026-09-30","w05":"2026-10-07","lu1":"2026-10-14","w06":"2026-10-21","lu2":"2026-10-28","w07":"2026-11-04","w08":"2026-11-18","w09":"2026-11-24","w10":"2026-12-02","w11":"2026-12-09"} },
};
const MEET_NAME = id => id.startsWith("lu") ? "★ Success Toolkit workshop" : "Week " + Number(id.slice(1));
const PROMPTS = {
  default:["One thing from today I could explain to a friend","Write one number you met in class today, with its units (for example: 746 W, 2.5 cm, 24 hr)","One question I still have (all questions are important 😊)"],
  w09:["One number my sheet computed today (with units)","One what-if I ran — and what it answered","The what-if I most need answered before presentation day"],
  w10:["My script prints ___ (units ___) — and does it match my sheet?","Our presentation cut is ___","One question before presentation day"],
  w11:["The best question my team was asked","One thing I would change about our talk or poster","One takeaway from another team's presentation"],
  lu:["One strategy from today I will actually try","When exactly I will use it this week","One question about studying, or about this course"],
};
const promptsFor = id => id.startsWith("lu") ? PROMPTS.lu : (PROMPTS[id] || PROMPTS.default);
const CHEERS = [
  "Uncertainty in your greatness today: \u00b10%.",
  "Another data point says you showed up \u2014 and the trend line looks strong. \ud83d\udcc8",
  "Slip received. Dimensional analysis confirms: you = one solid engineer.",
  "That\u2019s 1 slip \u00d7 13 weeks of momentum. Units check out. \ud83d\ude0a",
  "F = ma, and you just supplied the a. Nice acceleration.",
  "Logged, timestamped, appreciated \u2014 in that order.",
  "Your future PE license just felt a tiny disturbance of pride.",
  "Efficiency of today\u2019s effort: well above the Carnot limit. Don\u2019t tell thermodynamics.",
  "One more slip and the histogram of your semester keeps its beautiful shape.",
  "Signal received, noise negligible. See you next week. \ud83d\udee0\ufe0f",
  "Payback period on showing up today: about one exam you\u2019ll never have to take. \ud83d\ude09",
];

/* ================= BACKEND (Google Apps Script or local server.py) ================= */
const API = ENDPOINT || "api";              // "" -> same-origin /api (server.py mode)
const hasStore = () => true;                 // a backend is always assumed; failures fall back to codes
async function apiPost(payload){
  let lastErr = null;
  for (let tryN = 0; tryN < 3; tryN++){
    try {
      const r = await fetch(API, { method:"POST",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },   // simple request: no CORS preflight
        body: JSON.stringify(payload) });
      if (r.ok){ const j = await r.json(); if (j && j.ok) return j; lastErr = new Error(j && j.error || "backend said no"); }
      else lastErr = new Error("HTTP " + r.status);
    } catch(e){ lastErr = e; }
    await new Promise(res => setTimeout(res, 350 * (tryN + 1) * (tryN + 1)));
  }
  throw lastErr;
}
async function apiList(){
  const url = API + (API.includes("?") ? "&" : "?") + "action=list&key=" + encodeURIComponent(INSTRUCTOR_KEY);
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "list refused");
  return j.rows || [];
}
const saveSlip = rec => apiPost({ action:"submit", rec });
const delSlipRow = (sec, mid, slug) => apiPost({ action:"delete", key:INSTRUCTOR_KEY, sec, mid, slug });

/* ================= UTIL ================= */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slugify = s => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "student";
function todayMeeting(sec){
  const today = new Date().toISOString().slice(0,10);
  const d = SECTIONS[sec].dates;
  let best = SECTIONS[sec].meetings[0][0], gap = Infinity;
  for (const [id] of SECTIONS[sec].meetings){
    const g = Math.abs(new Date(d[id]) - new Date(today));
    if (g < gap){ gap = g; best = id; }
  }
  return best;
}
function download(name, text, type){
  const b = new Blob([text], {type}); const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
const encodeCode = rec => btoa(unescape(encodeURIComponent(JSON.stringify(rec))));
const decodeCode = s => JSON.parse(decodeURIComponent(escape(atob(s.trim()))));

/* ================= VIEWS ================= */
const app = $("#app");
function shell(inner, wide){
  document.body.classList.toggle("wide", !!wide);
  app.innerHTML = `<div class="slip">${inner}</div>
    <p class="note" style="color:#B9B2A4; text-align:center">Engineering Fundamentals · Fall 2026 · UMass Amherst</p>`;
}

function viewHome(){
  shell(`
    <div class="kicker">Engineering Fundamentals — Fall 2026</div>
    <h1>The exit slip</h1>
    <p class="sub">Three lines at the end of class. Sixty seconds, no paper.</p>
    <div class="modes">
      <button class="primary" id="bStudent">I'm a student — write my slip</button>
      <button class="ghost" id="bInstr">Instructor</button>
    </div>
    <p class="note">Your slip goes straight to your instructor and is read before the next session. If saving ever fails, the app gives you a short code to paste into Canvas instead — either way, your slip counts.</p>
  `);
  $("#bStudent").onclick = () => viewStudent();
  $("#bInstr").onclick = () => viewGate();
}

/* ---------- student ---------- */
let S = { sec:null, mid:null };
function viewStudent(){
  shell(`
    <div class="kicker">Step 1 of 2</div>
    <h1>Which section are you in?</h1>
    <div class="choices" id="secs">
      ${Object.entries(SECTIONS).map(([id,s]) => `
        <label class="choice" data-id="${id}">
          <input type="radio" name="sec" value="${id}">
          <span><span class="d">FYS 191ENG${id}</span><br><span class="m">${s.label} · ${s.room}</span></span>
        </label>`).join("")}
    </div>
    <button class="primary" id="next" disabled>Choose today's session</button>
  `);
  document.querySelectorAll(".choice").forEach(c => c.onclick = () => {
    document.querySelectorAll(".choice").forEach(x => x.classList.remove("sel"));
    c.classList.add("sel"); c.querySelector("input").checked = true;
    S.sec = c.dataset.id; $("#next").disabled = false;
  });
  $("#next").onclick = () => viewSlip();
}

function viewSlip(){
  S.mid = todayMeeting(S.sec);
  const sec = SECTIONS[S.sec];
  const opts = sec.meetings.map(([id,lab]) =>
    `<option value="${id}" ${id===S.mid?"selected":""}>${MEET_NAME(id)} — ${lab}</option>`).join("");
  const draw = () => {
    const P = promptsFor($("#meet").value);
    $("#prompts").innerHTML = P.map((p,i) => `
      <p class="prompt"><b>${i+1}.</b> ${esc(p)}</p>
      <textarea id="a${i}" maxlength="600" ${i===0?'autofocus':''}></textarea>`).join("");
  };
  shell(`
    <div class="kicker">FYS 191ENG${S.sec} · ${sec.label}</div>
    <h1>Today's slip</h1>
    <p class="prompt"><b>Session</b></p>
    <select id="meet">${opts}</select>
    <div class="row" style="margin-top:16px">
      <div><p class="prompt"><b>First name</b></p><input type="text" id="fn" autocomplete="given-name"></div>
      <div><p class="prompt"><b>Last name</b></p><input type="text" id="ln" autocomplete="family-name"></div>
    </div>
    <p class="prompt"><b>Student ID</b> (SPIRE number)</p>
    <input type="text" id="sid" inputmode="numeric" autocomplete="off" placeholder="8 digits">
    <div id="prompts"></div>
    <div class="err" id="err" hidden></div>
    <button class="primary" id="send">Hand in my slip</button>
    <p class="note">Blank lines are okay on a rough day — handing the slip in is what counts.</p>
  `);
  draw();
  $("#meet").onchange = draw;
  $("#send").onclick = submitSlip;
}

async function submitSlip(){
  const fn = $("#fn").value.trim(), ln = $("#ln").value.trim();
  const sid = $("#sid").value.replace(/\D/g, "");
  const err = $("#err");
  if (!fn || !ln){ err.textContent = "Add your first and last name so the point lands with you."; err.hidden = false; return; }
  if (sid.length < 5 || sid.length > 9){ err.textContent = "That Student ID doesn\u2019t look right \u2014 it\u2019s the 8-digit SPIRE number."; err.hidden = false; return; }
  const mid = $("#meet").value;
  const rec = {
    v:2, sec:S.sec, mid, name:(fn+" "+ln).replace(/\s+/g," "), id:sid,
    slug:slugify(ln+"-"+fn) + "-" + sid.slice(-4), ts:new Date().toISOString(),
    a:promptsFor(mid).map((_,i) => $("#a"+i).value.trim()),
  };
  $("#send").disabled = true; $("#send").textContent = "Handing in…";
  try {
    await saveSlip(rec);
    return viewStamp(rec, null);
  } catch(e){
    viewStamp(rec, encodeCode(rec));
  }
}

function viewStamp(rec, code){
  const sec = SECTIONS[rec.sec];
  const lab = sec.meetings.find(m => m[0]===rec.mid)[1];
  const P = promptsFor(rec.mid);
  shell(`
    <div class="stampwrap">
      <div class="kicker">FYS 191ENG${rec.sec}</div>
      <h1>Slip handed in</h1>
      <p class="sub">${esc(rec.name)} · ${MEET_NAME(rec.mid)} — ${lab}</p>
      <div class="stamp" role="status">RECEIVED ✓</div>
    </div>
    <p class="sub" style="color:var(--maroon); font-weight:700; margin-top:8px">${esc(CHEERS[Math.floor(Math.random()*CHEERS.length)])}</p>
    <div class="echo">
      ${rec.a.map((a,i)=>`<p class="q">${esc(P[i])}</p><p>${a?esc(a):'<span class="muted">—</span>'}</p>`).join("")}
    </div>
    ${code ? `
      <p class="err">Storage wasn't reachable, so here is your submission code — paste it into the Canvas box for this week:</p>
      <textarea readonly style="font-size:12px" rows="3" id="code">${code}</textarea>
      <button class="ghost tiny" id="copy" style="margin-top:8px">Copy code</button>`
    : `<p class="note">You're done — see you next week. Wrong session or a typo? Just submit again; the newest slip replaces the old one.</p>`}
    <button class="primary" id="again" style="background:var(--maroon-d)">Hand in another (next student)</button>
  `);
  if (code) $("#copy").onclick = () => { $("#code").select(); document.execCommand("copy"); $("#copy").textContent = "Copied ✓"; };
  $("#again").onclick = () => viewSlip();
}

/* ---------- instructor ---------- */
function viewGate(){
  shell(`
    <div class="kicker">Instructor</div>
    <h1>Passphrase</h1>
    <p class="sub">Set at the top of this file. Anyone with the link can open the student slip; this gate keeps the dashboard out of casual reach — it is a courtesy lock, not encryption.</p>
    <input type="text" id="pw" autocomplete="off">
    <div class="err" id="err" hidden>That's not it.</div>
    <button class="primary" id="go">Open dashboard</button>
  `);
  const go = () => { if ($("#pw").value.trim() === INSTRUCTOR_KEY) viewDash(); else $("#err").hidden = false; };
  $("#go").onclick = go;
  $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

let D = { rows:[], sec:"37-24", slips:{}, reading:null };
function latestRows(){
  const byKey = {};
  for (const r of D.rows){
    const k = r.sec + ":" + r.mid + ":" + r.slug;
    if (!byKey[k] || r.ts > byKey[k].ts) byKey[k] = r;
  }
  for (const rec of Object.values(D.slips)){
    const k = rec.sec + ":" + rec.mid + ":" + rec.slug;
    if (!byKey[k] || rec.ts > byKey[k].ts) byKey[k] = rec;
  }
  return Object.values(byKey);
}
async function viewDash(){
  shell(`
    <div class="kicker">Instructor dashboard</div>
    <h1>Slips, tallied</h1>
    <div class="bar">
      ${Object.keys(SECTIONS).map(s => `<button class="tab ${s===D.sec?'sel':''}" data-s="${s}">${s} · ${SECTIONS[s].label.split(" ")[0]}</button>`).join("")}
      <span style="flex:1"></span>
      <button class="tiny goldbtn" id="sync">Sync</button>
      <span class="prog" id="prog"></span>
    </div>
    <div id="matrix"><p class="note">Press Sync to load submissions from your backend.</p></div>
    <div class="bar" style="margin-top:18px">
      <button class="tiny ghost" id="csv">Download CSV</button>
      <button class="tiny ghost" id="backup">Back up everything</button>
      <button class="tiny ghost" id="restore">Restore a backup</button>
      <input type="file" id="restfile" accept="application/json" hidden>
      <button class="tiny ghost" id="paste">Paste codes</button>
    </div>
    <p class="note" id="safety">Data safety: every slip lives in your own backend (your Google Sheet, or the database file next to server.py). Back up weekly with one click \u2014 with a backup file on your computer, nothing can cost you more than a week.</p>
    <div id="reader"></div>
  `, true);

  document.querySelectorAll(".tab").forEach(t => t.onclick = () => { D.sec = t.dataset.s; viewDash(); });
  $("#sync").onclick = sync;
  $("#csv").onclick = exportCSV;
  $("#backup").onclick = fullBackup;
  $("#restore").onclick = () => $("#restfile").click();
  $("#restfile").onchange = restoreBackup;
  $("#paste").onclick = viewPaste;
  if (D.rows.length) drawMatrix();
}
async function sync(){
  $("#prog").textContent = "loading…";
  try { D.rows = await apiList(); } catch(e){ $("#prog").textContent = "couldn't reach the backend — check ENDPOINT and try again"; return; }
  $("#prog").textContent = D.rows.length + " slips loaded";
  drawMatrix();
}
function roster(){
  const rows = {};
  for (const rec of latestRows()){
    if (rec.sec !== D.sec) continue;
    const r = rows[rec.slug] = rows[rec.slug] || { slug:rec.slug, marks:{} };
    r.marks[rec.mid] = rec;
    r.name = rec.name || r.name;
  }
  return Object.values(rows).sort((a,b) => a.slug.localeCompare(b.slug));
}
function drawMatrix(){
  const mts = SECTIONS[D.sec].meetings;
  const rows = roster();
  const head = mts.map(([id]) => `<th>${id.startsWith("lu") ? "★" : id.replace("w0","").replace("w","")}</th>`).join("");
  const body = rows.map(r => {
    const n = Object.keys(r.marks).length;
    const pts = Math.min(n, BEST_OF);
    return `<tr><td class="name">${esc(r.name || r.slug.replace(/-\d{4}$/, "").replace(/-/g, " "))}</td>
      ${mts.map(([id]) => r.marks[id] ? `<td class="on">✓</td>` : `<td class="muted">·</td>`).join("")}
      <td>${n}</td><td class="pts">${pts}/${BEST_OF}</td></tr>`;
  }).join("");
  $("#matrix").innerHTML = rows.length ? `
    <table><thead><tr><th style="text-align:left">Student</th>${head}<th>slips</th><th>points</th></tr></thead>
    <tbody>${body}</tbody></table>
    <div class="bar" style="margin-top:10px">
      ${mts.map(([id,lab]) => `<button class="tiny tab" data-m="${id}">${MEET_NAME(id).replace("Success Toolkit workshop","workshop")} · read</button>`).join("")}
    </div>` :
    `<p class="note">No slips for section ${D.sec} yet. An empty dashboard is just a class that hasn't ended.</p>`;
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => readWeek(b.dataset.m));
}
async function readWeek(mid){
  const box = $("#reader");
  const P = promptsFor(mid);
  const list = latestRows().filter(r => r.sec === D.sec && r.mid === mid)
                           .sort((a,b) => a.slug.localeCompare(b.slug));
  box.innerHTML = `<h1 style="font-size:20px; margin-top:20px">${MEET_NAME(mid)} — ${esc(SECTIONS[D.sec].meetings.find(m=>m[0]===mid)[1])}</h1><div class="cards" id="cards"></div>`;
  const cards = $("#cards");
  for (const rec of list){
    cards.insertAdjacentHTML("beforeend", `<div class="card">
      <h4>${esc(rec.name)} <span class="pill">${new Date(rec.ts).toLocaleString()}</span>
        <button class="tiny ghost" style="float:right" data-slug="${esc(rec.slug)}">remove</button></h4>
      ${(rec.a||[]).map((a,i) => `<p class="q">${esc(P[i]||"")}</p><p class="a ${i===2?'a3':''}">${a ? esc(a) : '<span class="muted">—</span>'}</p>`).join("")}
    </div>`);
  }
  $("#prog").textContent = list.length + " slips";
  if (!list.length) cards.innerHTML = `<p class="note">No slips for this session yet.</p>`;
  cards.querySelectorAll("[data-slug]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this slip? The student's point for this session goes with it.")) return;
    try {
      await delSlipRow(D.sec, mid, b.dataset.slug);
      D.rows = D.rows.filter(r => !(r.sec === D.sec && r.mid === mid && r.slug === b.dataset.slug));
      viewDash();
    } catch(e){ $("#prog").textContent = "remove failed — try again"; }
  });
}
async function fullBackup(){
  try { D.rows = await apiList(); } catch(e){ $("#prog").textContent = "couldn't reach the backend"; return; }
  const records = latestRows();
  const stamp = new Date().toISOString();
  download(`exit-slips-FULL-backup-${stamp.slice(0,10)}.json`,
    JSON.stringify({ version: 3, exported: stamp, count: records.length, records }, null, 1), "application/json");
  $("#prog").textContent = `backed up ${records.length} slips \u2713 \u2014 keep this file safe`;
}
async function restoreBackup(ev){
  const f = ev.target.files[0]; if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch(e){ $("#prog").textContent = "that file is not a valid backup"; return; }
  const records = (data.records || []).filter(r => r && r.sec && r.mid && r.slug);
  if (!records.length){ $("#prog").textContent = "backup contains no slips"; return; }
  if (!confirm(`Restore ${records.length} slips to the backend?`)) return;
  let ok = 0, fail = 0;
  for (let i = 0; i < records.length; i++){
    $("#prog").textContent = `restoring ${i+1}/${records.length}\u2026`;
    try { await apiPost({ action:"submit", rec: records[i] }); ok++; } catch(e){ fail++; }
  }
  $("#prog").textContent = `restored ${ok} slips` + (fail ? `, ${fail} failed \u2014 run restore again` : " \u2713");
  sync();
}
function exportCSV(){
  const mts = SECTIONS[D.sec].meetings;
  const rows = roster();
  const head = ["student", "id_last4", ...mts.map(([id]) => id), "slips", `points_best_${BEST_OF}`].join(",");
  const lines = rows.map(r => {
    const n = Object.keys(r.marks).length;
    const m = r.slug.match(/-(\d{4})$/);
    return [ '"' + (r.name || r.slug.replace(/-\d{4}$/, "").replace(/-/g," ")).replace(/"/g,'""') + '"',
      m ? m[1] : "", ...mts.map(([id]) => r.marks[id] ? 1 : 0), n, Math.min(n, BEST_OF) ].join(",");
  });
  download(`exit-slips-${D.sec}.csv`, [head, ...lines].join("\n"), "text/csv");
}
function viewPaste(){
  shell(`
    <div class="kicker">Instructor</div>
    <h1>Paste submission codes</h1>
    <p class="sub">For slips handed in as codes (for example via a Canvas text box): one code per line.</p>
    <textarea id="codes" rows="8" style="font-size:12px"></textarea>
    <div class="err" id="err" hidden></div>
    <button class="primary" id="load">Add these slips</button>
    <button class="ghost" id="back" style="width:100%; margin-top:10px">Back to dashboard</button>
  `);
  $("#back").onclick = viewDash;
  $("#load").onclick = () => {
    let ok = 0, bad = 0;
    for (const line of $("#codes").value.split(/\s+/).filter(Boolean)){
      try { const rec = decodeCode(line); D.slips[`${rec.sec}:${rec.mid}:${rec.slug}`] = rec; ok++; }
      catch(e){ bad++; }
    }
    if (bad){ $("#err").textContent = `${ok} added, ${bad} lines were not valid codes.`; $("#err").hidden = false; }
    else viewDash();
  };
}

viewHome();
